name: US English release

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - .github/workflows/us-english-release.yml

permissions:
  contents: write

concurrency:
  group: us-english-release
  cancel-in-progress: false

env:
  UPSTREAM_REPO: AndyHazz/bookshelf.koplugin
  PATCH_BRANCH: add-en-us-localization
  ASSET_NAME: bookshelf.koplugin.zip

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master --tags
          git fetch origin "+refs/heads/${PATCH_BRANCH}:refs/remotes/origin/${PATCH_BRANCH}"

      - name: Find latest upstream release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_json="$(gh api "repos/${UPSTREAM_REPO}/releases/latest")"
          upstream_tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
          if [[ -z "$upstream_tag" ]]; then
            echo "Could not determine the latest upstream release tag." >&2
            exit 1
          fi

          asset_count="$(jq --arg name "$ASSET_NAME" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
          if [[ "$asset_count" != "1" ]]; then
            echo "Expected exactly one upstream release asset named $ASSET_NAME; found $asset_count." >&2
            exit 1
          fi

          patched_tag="${upstream_tag}-us1"
          echo "upstream_tag=$upstream_tag" >> "$GITHUB_OUTPUT"
          echo "patched_tag=$patched_tag" >> "$GITHUB_OUTPUT"

          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${patched_tag}" >/dev/null 2>&1; then
            echo "new_release=false" >> "$GITHUB_OUTPUT"
            echo "Patched release $patched_tag already exists; nothing to do."
          else
            echo "new_release=true" >> "$GITHUB_OUTPUT"
            echo "New upstream release detected: $upstream_tag"
          fi

      - name: Sync fork master with upstream
        if: steps.latest.outputs.new_release == 'true'
        run: |
          git switch master
          git merge --no-edit upstream/master
          git push origin master

      - name: Rebase US English patch branch
        if: steps.latest.outputs.new_release == 'true'
        id: patch
        run: |
          git switch -C "$PATCH_BRANCH" "origin/$PATCH_BRANCH"
          git rebase upstream/master
          git push --force-with-lease origin "$PATCH_BRANCH"

          mapfile -t changed < <(git diff --name-only upstream/master..HEAD)
          printf 'Patch branch changes:\n'
          printf '  %s\n' "${changed[@]}"

          unexpected="$(printf '%s\n' "${changed[@]}" | grep -Ev '^(lib/bookshelf_i18n\.lua|locale/en_US\.po)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo "Patch branch contains unexpected files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi

          git diff --binary upstream/master..HEAD -- lib/bookshelf_i18n.lua locale/en_US.po > /tmp/us-english.patch
          if [[ ! -s /tmp/us-english.patch ]]; then
            echo "patch_empty=true" >> "$GITHUB_OUTPUT"
            echo "The US English changes are already present upstream; no custom release is needed."
          else
            echo "patch_empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply patch to the exact upstream release source
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        run: |
          git worktree add --detach /tmp/release-src "${{ steps.latest.outputs.upstream_tag }}"
          cd /tmp/release-src
          git apply --check /tmp/us-english.patch
          git apply /tmp/us-english.patch

      - name: Install validation tools
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        run: sudo apt-get update && sudo apt-get install -y lua5.4 luajit gettext zip unzip

      - name: Validate patched release source
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        run: |
          cd /tmp/release-src

          fail=0
          while IFS= read -r -d '' f; do
            luajit -b "$f" /dev/null || { echo "syntax FAIL: $f"; fail=1; }
          done < <(find . -name '*.lua' -not -path './.git/*' -not -path './.claude/*' -print0)
          [[ "$fail" == 0 ]]

          fail=0
          for f in tests/_test_*.lua; do
            echo "== $f =="
            lua5.4 "$f" || fail=1
          done
          [[ "$fail" == 0 ]]

          fail=0
          for f in locale/*.po; do
            echo "== $f =="
            msgfmt --check -o /dev/null "$f" || fail=1
          done
          [[ "$fail" == 0 ]]

      - name: Download official upstream release ZIP
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/upstream-release
          gh release download "${{ steps.latest.outputs.upstream_tag }}" \
            --repo "$UPSTREAM_REPO" \
            --pattern "$ASSET_NAME" \
            --dir /tmp/upstream-release
          unzip -t "/tmp/upstream-release/$ASSET_NAME"

      - name: Build patched ZIP from the official release ZIP
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        run: |
          mkdir -p dist /tmp/zip-patch/bookshelf.koplugin/lib /tmp/zip-patch/bookshelf.koplugin/locale
          cp "/tmp/upstream-release/$ASSET_NAME" "dist/$ASSET_NAME"
          cp /tmp/release-src/lib/bookshelf_i18n.lua /tmp/zip-patch/bookshelf.koplugin/lib/
          cp /tmp/release-src/locale/en_US.po /tmp/zip-patch/bookshelf.koplugin/locale/

          cd /tmp/zip-patch
          zip -u "$GITHUB_WORKSPACE/dist/$ASSET_NAME" \
            bookshelf.koplugin/lib/bookshelf_i18n.lua \
            bookshelf.koplugin/locale/en_US.po
          cd "$GITHUB_WORKSPACE"
          unzip -t "dist/$ASSET_NAME"

      - name: Verify only the US English files changed
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        run: |
          rm -rf /tmp/official-check /tmp/patched-check
          mkdir /tmp/official-check /tmp/patched-check
          unzip -q "/tmp/upstream-release/$ASSET_NAME" -d /tmp/official-check
          unzip -q "dist/$ASSET_NAME" -d /tmp/patched-check

          test -d /tmp/official-check/bookshelf.koplugin
          test -d /tmp/patched-check/bookshelf.koplugin

          cmp /tmp/patched-check/bookshelf.koplugin/lib/bookshelf_i18n.lua /tmp/release-src/lib/bookshelf_i18n.lua
          cmp /tmp/patched-check/bookshelf.koplugin/locale/en_US.po /tmp/release-src/locale/en_US.po

          rm -f /tmp/official-check/bookshelf.koplugin/lib/bookshelf_i18n.lua
          rm -f /tmp/official-check/bookshelf.koplugin/locale/en_US.po
          rm -f /tmp/patched-check/bookshelf.koplugin/lib/bookshelf_i18n.lua
          rm -f /tmp/patched-check/bookshelf.koplugin/locale/en_US.po

          diff -qr /tmp/official-check /tmp/patched-check
          sha256sum "dist/$ASSET_NAME" | tee dist/SHA256SUMS.txt

      - name: Publish patched release
        if: steps.latest.outputs.new_release == 'true' && steps.patch.outputs.patch_empty == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.latest.outputs.patched_tag }}" \
            "dist/$ASSET_NAME" \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$PATCH_BRANCH" \
            --title "Bookshelf ${{ steps.latest.outputs.upstream_tag }} - US English" \
            --notes "Built automatically from AndyHazz/bookshelf.koplugin ${{ steps.latest.outputs.upstream_tag }} using the maintainer's official $ASSET_NAME as the base. Only the US-English localization patch is applied."

      - name: Summary
        if: always()
        run: |
          {
            echo "## US English release automation"
            echo
            echo "Upstream release: ${{ steps.latest.outputs.upstream_tag }}"
            echo "Patched release: ${{ steps.latest.outputs.patched_tag }}"
            echo "New release detected: ${{ steps.latest.outputs.new_release }}"
            echo "Patch already upstream: ${{ steps.patch.outputs.patch_empty }}"
          } >> "$GITHUB_STEP_SUMMARY"
